name: Kotlin Mobile Engine

on:
  schedule:
    # Wakes up at 41 minutes past 1 AM, 7 AM, 1 PM, and 7 PM UTC
    # (9:41 AM, 3:41 PM, 9:41 PM, and 3:41 AM Singapore Time)
    - cron: '41 1,7,13,19 * * *'
  workflow_dispatch:

jobs:
  kt-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Fetch Mobile Source
        uses: actions/checkout@v4

      - name: Mutate Data Class Definitions
        run: |
          # 30% chance to skip (maintains natural contribution gaps)
          if [ $((RANDOM % 100)) -lt 30 ]; then
            echo "Kotlin data classes current. Skipping execution."
            exit 0
          fi

          mkdir -p src/main/kotlin/com/app/model
          TARGET_FILE="src/main/kotlin/com/app/model/ViewState.kt"

          if [ ! -f "$TARGET_FILE" ]; then
            echo "package com.app.model" > "$TARGET_FILE"
            echo "" >> "$TARGET_FILE"
            echo "// Auto-generated UI state definitions" >> "$TARGET_FILE"
          fi

          COMPONENTS=("UserViewState" "NavigationState" "CardPayload" "ThemeConfig" "MetricEntry")
          PICKED_COMP=${COMPONENTS[$RANDOM % ${#COMPONENTS[@]}]}

          echo "" >> "$TARGET_FILE"
          echo "/** UI state node $RANDOM */" >> "$TARGET_FILE"
          echo "data class ${PICKED_COMP}_$RANDOM(" >> "$TARGET_FILE"
          echo "    val id: Long = ${RANDOM}L," >> "$TARGET_FILE"
          echo "    val isVisible: Boolean = true," >> "$TARGET_FILE"
          echo "    val payload: String? = null" >> "$TARGET_FILE"
          echo ")" >> "$TARGET_FILE"

          git config --global user.name "GUOJILL"
          git config --global user.email "guojill05@gmail.com"

          MESSAGES=(
            "feat: add kotlin data class representation for view state"
            "refactor: optimize nullability parameters on ui models"
            "fix: update default property values in kt data models"
            "chore: sync android state binding specifications"
          )
          MSG=${MESSAGES[$RANDOM % ${#MESSAGES[@]}]}

          git add src/
          git commit -m "$MSG"
          git push
